#
# nfpm spec for nke-cni-ovn-charts-<stream>. build-deb.sh exports
# PACKAGE_NAME, OVN_STREAM, DEB_REVISION, ARCH, CHART_DIR and SRC.
#
# The chart is unpacked, not shipped as a tgz: nke-agent runs helm on
# /etc/dgx/ovn-kubernetes when values-nke.yaml is there (ovnHelmChartStaged in
# agent/internal/agent/cni.go), else on the directory of the first Chart.yaml
# that dpkg-query -L lists for this package.

name: "nke-cni-ovn-charts-${OVN_STREAM}"
arch: "${ARCH}"
platform: "linux"
version: "${DEB_REVISION}"
version_schema: none
section: admin
priority: optional
maintainer: "NKE <nke-dev@exchange.nvidia.com>"
mtime: "2026-01-01T00:00:00Z"
description: |
  ovn-kubernetes ${OVN_STREAM} Helm chart for NKE nodes
  The nv-ngn ovn-kubernetes chart, unpacked to ${CHART_DIR}, where nke-agent
  runs helm on it with values-nke.yaml when it installs the CNI. The container
  images ship separately in nke-cni-ovn-images-${OVN_STREAM}; install both
  for a node with no registry access.

# Every stream unpacks to the same directory, so only one can be installed.
provides:
  - nke-cni-ovn-charts
conflicts:
  - nke-cni-ovn-charts

contents:
  - src: "${SRC}/charts/ovn-kubernetes"
    dst: "${CHART_DIR}"
    type: tree
    expand: true
