#
# Verifies the committed oapi-codegen output still matches controller/api/openapi.yaml.
#
# controller/Makefile has had a `generate-check` target for exactly this, and
# nothing ever called it: no workflow referenced generate-check, go generate or
# oapi-codegen. That left 10,000+ lines of generated client and server code
# free to drift from the API contract they are generated from.
#
# The drift is not hypothetical and not greppable. api/server.gen.go embeds the
# OpenAPI spec as gzip+base64, so a stale copy sits inside a compressed blob
# where no code search can see it -- which is how one survived a re-snapshot
# until it was found by decoding the blob.
#
# This is the third generated-artefact gate, alongside notices-check.yml and
# go-work-check.yml.

name: Generate Check

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
      # Dependabot branches are mirrored to neither of the above. A bump to the
      # generator or to kin-openapi changes the output, so this is precisely a
      # pull request where the check needs to run. Same list as
      # notices-check.yml.
      - "dependabot/**"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  generate-check:
    name: Check generated API code is up to date
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke'
    timeout-minutes: 20
    permissions:
      contents: read
    # GOWORK=off is required, not incidental. The generator is pinned in its
    # own module file (api/oapi-codegen.mod) because it needs an older
    # kin-openapi than the api module does, and Go refuses -modfile in
    # workspace mode: "go: -modfile cannot be used in workspace mode". The
    # module resolves from public dependencies alone, so dropping the workspace
    # costs nothing here.
    env:
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: controller/api/go.mod
          cache: true
          cache-dependency-path: |
            controller/api/go.sum
            controller/api/oapi-codegen.sum

      # Regenerates from openapi.yaml with the pinned generator and fails if the
      # result differs from what is committed. The target expects a clean tree,
      # which a fresh checkout is.
      - name: Verify generated API code is up to date
        working-directory: controller
        run: make generate-check
