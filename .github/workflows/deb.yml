#
# Builds the nke-agent Debian packages and inspects what came out.
#
# Nothing built them before. The .deb is how the agent reaches a node, and it
# was the only artefact in the repository with no CI at all -- not even a lint.
# That is worse than it sounds, because it did not merely go unbuilt: `make
# deb-all` could not produce a package on main, and no job existed to say so.
#
#   dpkg-deb: error: 'Version' field value 'f0578cc8':
#             version number does not start with digit
#
# DEB_VERSION comes from `git describe --match 'agent/v*'`, this repository has
# no such tag, and `--always` falls back to a bare commit sha. dpkg requires a
# version starting with a digit. The Makefile now prefixes 0.0.0- in that case,
# and the assertions below are what stop it regressing.
#
# The packages are thrown away. The value is that the packaging path is
# exercised on every change to agent/, in the same way Go Build exercises the
# compile path -- see the header of go-build.yml for the same reasoning.
#
# ubuntu-latest with `pull_request`, deliberately: dpkg-deb and fakeroot are
# Debian tooling and the agent builds from public dependencies, so this needs no
# NVIDIA runner and no credentials, and therefore also covers fork and
# Dependabot pull requests.

name: Debian Package

# The two path lists are duplicated by hand. github.com has supported YAML
# anchors since August 2025, but GitHub Enterprise Server does not, and merge
# keys are still unsupported everywhere. Keep the two lists identical.
on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'go.work'
      - 'go.work.sum'
      - 'vendor/**'
      - '.github/workflows/deb.yml'
  pull_request:
    branches: [main]
    paths:
      - 'agent/**'
      - 'go.work'
      - 'go.work.sum'
      - 'vendor/**'
      - '.github/workflows/deb.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not cancel a run on main; the newer workflows here all guard this.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deb:
    name: Build the Debian packages
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # DEB_VERSION is derived from `git describe`, so the version under
          # test depends on the tags being present. A shallow clone would make
          # every build look untagged and quietly stop exercising the tagged
          # path once agent/v* tags exist.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.work, not agent/go.mod. The package build runs `go build` with the
          # workspace active, so the workspace's floor is the one that has to be
          # satisfied -- and it is higher: go.work is at 1.26.4 while
          # agent/go.mod declares 1.26.0. setup-go pins GOTOOLCHAIN=local, so
          # reading the module instead fails outright rather than fetching a
          # newer toolchain:
          #
          #   go: ../go.work requires go >= 1.26.4
          #       (running go 1.26.0; GOTOOLCHAIN=local)
          #
          # go-build.yml and go-work-check.yml read go.work for the same reason.
          # notices-check.yml reads agent/go.mod and is also correct, because it
          # sets GOWORK=off and builds the module on its own.
          go-version-file: go.work
          cache: true

      - name: Install the Debian packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot dpkg-dev
          dpkg-deb --version | head -1

      - name: Build the packages
        working-directory: agent
        run: make deb-all

      # The build succeeding is not the assertion. dpkg-deb will happily produce
      # a package that installs nothing, so this checks what is actually inside.
      - name: Inspect what was produced
        working-directory: agent
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(bin/*.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "::error::make deb-all produced no .deb at all"
            exit 1
          fi
          if [ ${#debs[@]} -ne 2 ]; then
            echo "::error::expected 2 packages (amd64 and arm64), found ${#debs[@]}:"
            printf '    %s\n' "${debs[@]}"
            exit 1
          fi

          seen_arches=""
          for deb in "${debs[@]}"; do
            echo "::group::${deb}"
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
            echo "::endgroup::"

            pkg=$(dpkg-deb -f "$deb" Package)
            ver=$(dpkg-deb -f "$deb" Version)
            arch=$(dpkg-deb -f "$deb" Architecture)

            [ "$pkg" = "nke-agent" ] \
              || { echo "::error::${deb}: Package is '${pkg}', expected 'nke-agent'"; exit 1; }

            # The regression guard for the bug this workflow was written after.
            # dpkg itself rejects this at build time, but asserting it here names
            # the cause instead of leaving a parser error to be decoded.
            case "$ver" in
              [0-9]*) ;;
              *) echo "::error::${deb}: Version '${ver}' does not start with a digit; dpkg will reject it. DEB_VERSION derives from 'git describe --match agent/v*'."; exit 1 ;;
            esac

            case "$arch" in
              amd64|arm64) ;;
              *) echo "::error::${deb}: unexpected Architecture '${arch}'"; exit 1 ;;
            esac
            case "$seen_arches" in
              *"$arch"*) echo "::error::two packages built for the same architecture '${arch}'"; exit 1 ;;
            esac
            seen_arches="${seen_arches} ${arch}"

            # A package that ships no binary would otherwise pass everything
            # above. The systemd unit matters for the same reason: the agent is
            # installed as a service, so an empty unit directory is a broken
            # install that still produces a valid .deb.
            contents=$(dpkg-deb -c "$deb")
            printf '%s\n' "$contents" | grep -q './usr/local/bin/nke-agent' \
              || { echo "::error::${deb}: does not contain /usr/local/bin/nke-agent"; exit 1; }
            printf '%s\n' "$contents" | grep -q './etc/systemd/system/.*\.service' \
              || { echo "::error::${deb}: contains no systemd unit"; exit 1; }

            echo "OK  ${deb}  package=${pkg} version=${ver} arch=${arch}"
          done

      - name: Summarise
        if: always()
        working-directory: agent
        run: |
          {
            echo "## Debian packages"
            echo
            if compgen -G 'bin/*.deb' > /dev/null; then
              echo '| Package | Version | Arch | Size |'
              echo '|---|---|---|---|'
              for deb in bin/*.deb; do
                printf '| %s | %s | %s | %s |\n' \
                  "$(dpkg-deb -f "$deb" Package)" \
                  "$(dpkg-deb -f "$deb" Version)" \
                  "$(dpkg-deb -f "$deb" Architecture)" \
                  "$(du -h "$deb" | cut -f1)"
              done
            else
              echo 'No packages were produced.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
