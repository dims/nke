#
# Renders the REST API Reference and checks the documentation site.
#
# controller/api/openapi.yaml is the source of the REST API Reference. Fern
# renders it in the "REST API Reference" tab of the documentation site, and
# `make -C controller/api docs` renders the same file into one self-contained
# HTML page with Redocly. Both drop the surface marked `x-fern-ignore`.
#
# Three steps:
#   1. Build that HTML page and upload it as an artifact, so a reviewer can
#      open the rendered reference for the pull request.
#   2. Run `fern check`, so a broken link or an invalid docs.yml is caught
#      before merge.
#   3. On main, publish the Fern site when FERN_TOKEN is set. Until the
#      secret is configured the step is skipped and says so.
#
# Advisory, not a merge-gate member: publishing needs a secret, which the
# workflow design guide keeps out of the required gate. Path-filtered on both
# events because an advisory check cannot leave a pull request waiting.
#
# Node is preinstalled on the GitHub-hosted runner. The two CLIs are pinned in
# make/tool-versions.mk and fetched with npx.

name: API docs

on:
  push:
    branches: [main]
    paths:
      - 'controller/api/openapi.yaml'
      - 'controller/api/redocly.yaml'
      - 'controller/api/Makefile'
      - 'make/tool-versions.mk'
      - 'docs/**'
      - 'fern/**'
      - 'cli/docs/**'
      - 'controller/docs/**'
      - '.github/workflows/api-docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'controller/api/openapi.yaml'
      - 'controller/api/redocly.yaml'
      - 'controller/api/Makefile'
      - 'make/tool-versions.mk'
      - 'docs/**'
      - 'fern/**'
      - 'cli/docs/**'
      - 'controller/docs/**'
      - '.github/workflows/api-docs.yml'
  workflow_dispatch: {}

permissions: {}

concurrency:
  # The sha is part of the group on main, so every commit gets its own result.
  group: API docs-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  render:
    name: Render the REST API Reference
    runs-on: ubuntu-latest
    if: github.repository == 'dsx-ai-factory/nke'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render openapi.yaml with Redocly
        run: make -C controller/api docs

      - name: Upload the rendered reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-reference
          path: controller/.local/api-reference.html
          if-no-files-found: error
          retention-days: 30

  fern:
    name: Check the documentation site
    runs-on: ubuntu-latest
    if: github.repository == 'dsx-ai-factory/nke'
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Fern CLI version
        id: pin
        run: echo "version=$(make --no-print-directory print-FERN_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check the site definition
        working-directory: fern
        env:
          FERN_VERSION: ${{ steps.pin.outputs.version }}
        run: npx -y "fern-api@${FERN_VERSION}" check

      - name: Publish the site
        if: github.event_name == 'push' && env.FERN_TOKEN != ''
        working-directory: fern
        env:
          FERN_VERSION: ${{ steps.pin.outputs.version }}
        run: npx -y "fern-api@${FERN_VERSION}" generate --docs

      - name: Say why the site was not published
        if: github.event_name == 'push' && env.FERN_TOKEN == ''
        run: echo "::notice::FERN_TOKEN is not configured, so the site was checked but not published."
